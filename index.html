<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Chess Game</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div class="chess_board">
        <!-- Board generated by JS -->
    </div>

    <!-- Promotion Modal -->
    <div id="promotionModal" class="modal">
        <div class="modal-content">
            <h2>Promote Pawn</h2>
            <p>Choose a piece:</p>
            <div class="promotion-pieces">
                <button class="promotion-btn" data-piece="q">
                    <img src="assets/images/queen-w.svg" alt="Queen" class="promotion-img white-piece">
                    <img src="assets/images/queen-b.svg" alt="Queen" class="promotion-img black-piece">
                </button>
                <button class="promotion-btn" data-piece="r">
                    <img src="assets/images/rook-w.svg" alt="Rook" class="promotion-img white-piece">
                    <img src="assets/images/rook-b.svg" alt="Rook" class="promotion-img black-piece">
                </button>
                <button class="promotion-btn" data-piece="b">
                    <img src="assets/images/bishop-w.svg" alt="Bishop" class="promotion-img white-piece">
                    <img src="assets/images/bishop-b.svg" alt="Bishop" class="promotion-img black-piece">
                </button>
                <button class="promotion-btn" data-piece="n">
                    <img src="assets/images/knight-w.svg" alt="Knight" class="promotion-img white-piece">
                    <img src="assets/images/knight-b.svg" alt="Knight" class="promotion-img black-piece">
                </button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal">
        <div class="modal-content">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverMessage">Checkmate! White wins.</p>
            <button class="restart-btn" onclick="location.reload()">Restart Game</button>
        </div>
    </div>



    <script type="module" src="js/main.js"></script>

</body>

</html>
